name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.26"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test library
        run: go test ./... -count=1

      - name: Benchmark smoke
        run: go test ./toon -bench=BenchmarkEncodeJSON_Small -benchmem -run=^$ -count=1

      - name: Build CLI
        run: go build -o go-toon ./cmd/go-toon
